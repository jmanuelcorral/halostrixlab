### Plantilla: no se ejecuta automáticamente. Sustituye los dos CHANGE_ME.
model_name_or_path: /workspace/models/CHANGE_ME
stage: sft
do_train: true
finetuning_type: lora
lora_target: all

dataset_dir: /workspace/data
dataset: CHANGE_ME
template: default
cutoff_len: 1024
max_samples: 100
overwrite_cache: false
preprocessing_num_workers: 4

output_dir: /workspace/saves/poc-lora-bf16
logging_steps: 5
save_steps: 25
plot_loss: true
overwrite_output_dir: false
save_only_model: false

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0001
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
fp16: false
